[project]
name = "ralph"
version = "0.1.0"
description = "Ralph v1 — per-repo autonomous coding loop executor and supervisor skills"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "responses>=0.26.1",
    "types-requests>=2.33.0.20260518",
    "freezegun>=1.5",
    "dockerfile-parse>=2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["ralph_executor", "scripts", "skills", "tests"]
# Each skill's scripts/__init__.py is a discovery marker only — the
# directory name (e.g. "ralph-add") is not a valid Python identifier, so
# the script is imported via importlib.util.spec_from_file_location at
# runtime. Without exclusion, mypy reports a duplicate-module collision
# against the top-level scripts/ package.
exclude = [
    "skills/[^/]+/scripts/__init__\\.py$",
]

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["ralph_executor*"]

[project.scripts]
ralph-executor = "ralph_executor.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"' or env-gated)",
]
